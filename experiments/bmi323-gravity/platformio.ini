[platformio]
default_envs = esp32-c6-devkitm-1

[env:esp32-c6-devkitm-1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = espidf
monitor_speed = 115200

[env:i2c-scan]
extends = env:esp32-c6-devkitm-1
extra_scripts = pre:diagnostics/select_scan.py

[env:dual-stream]
extends = env:esp32-c6-devkitm-1
extra_scripts = pre:diagnostics/select_dual.py
build_flags = -D DUAL_HZ=100

[env:dual-200]
extends = env:dual-stream
build_flags = -D DUAL_HZ=200

[env:dual-400]
extends = env:dual-stream
build_flags = -D DUAL_HZ=400

[env:dual-800]
extends = env:dual-stream
build_flags = -D DUAL_HZ=800

[env:dual-wifi]
extends = env:dual-stream
build_flags = -D DUAL_HZ=400 -D DUAL_WIFI=1
