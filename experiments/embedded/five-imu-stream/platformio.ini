[platformio]
default_envs = feather-esp32-s3

[env:feather-esp32-s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 4MB

[env:stream-200]
extends = env:feather-esp32-s3
build_flags = -D STREAM_200

[env:profile-200]
extends = env:feather-esp32-s3
build_flags = -D STREAM_200 -D PROFILE_200

[env:binary-200]
extends = env:feather-esp32-s3
build_flags = -D BINARY_200
