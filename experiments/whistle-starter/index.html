<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whistle Starter</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#e9f0ee;background:#101a1d}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:40px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{color:#9eafb2;line-height:1.6}button{border:0;border-radius:9px;padding:13px 22px;font:600 15px system-ui;cursor:pointer;background:#80e5c2;color:#0f2922}button.secondary{background:#26373c;color:#d7e4e4;padding:9px 14px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eee;outline-offset:3px}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:60%;min-width:min(100%,280px);margin:12px 0}.card,.chart{border:1px solid #2c4045;border-radius:14px;background:#152429}.card{height:48px;padding:3px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}#note-card{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px}#note-card .value{font-size:20px;line-height:1;margin:0}.label{color:#a6b8bb;font-size:10px;line-height:1}.value{font-size:clamp(18px,2vw,25px);line-height:1.1;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}.unit{font-size:14px;color:#a6b8bb}.chart{padding:20px 20px 8px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.chart-head span{font-size:12px;color:#a6b8bb}canvas{width:100%;display:block;margin-top:6px}#plot{height:680px}#level-plot{height:80px;margin-top:4px}.graph-control input{display:block;width:140px;max-width:100%;accent-color:#80e5c2;margin:7px 0 0}#threshold{display:block;width:220px;max-width:100%;accent-color:#80e5c2;margin:7px 0 0}#status{min-height:26px;margin:12px 0 0;color:#8fe5ca}#error{color:#ffb9ae;margin:8px 0}.selectors{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin:14px 0}.selectors label{font-size:13px;color:#a6b8bb}.selectors select{display:block;margin-top:5px;padding:7px 10px;border:1px solid #3a4c51;border-radius:7px;background:#203036;color:#e9f0ee;font:inherit}[hidden]{display:none!important}@media(max-width:700px){main{padding:0 16px;margin:24px auto}header{align-items:flex-start}.card{padding:3px 8px}.value{font-size:20px}.chart-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main>
<header><div><h1>Whistle Starter</h1><p style="margin:0">Live microphone pitch and its scrolling trail.</p></div><button id="toggle">Start microphone</button></header>
<p id="status" role="status">Stopped · ready when you are</p><p id="error" role="alert" hidden></p>
<div class="selectors"><label for="microphone">Microphone<select id="microphone"><option value="">System default</option></select></label><button class="secondary" id="refresh-microphones" type="button">Refresh devices</button></div>
<section class="readouts" aria-label="Current pitch"><div class="card"><div class="label">Frequency</div><div class="value"><span id="hz">—</span> <span class="unit">Hz</span></div></div><div class="card" id="note-card"><div class="label">Nearest note</div><div class="value" id="note">—</div></div></section>
<section class="chart"><div class="chart-head"><strong>Pitch trail</strong><span id="window-label">Last 8 seconds · semitone scale · A4 = 440 Hz</span></div><div class="selectors"><label for="graph-low">Lowest note<select id="graph-low"></select></label><label for="graph-high">Highest note<select id="graph-high"></select></label><label for="threshold">Signal threshold <strong id="threshold-value">−45 dBFS</strong><input id="threshold" type="range" min="-70" max="-15" value="-45" step="1"></label><label class="graph-control" for="graph-height">Graph height <output id="graph-height-value">680 px</output><input id="graph-height" type="range" min="150" max="700" value="680" step="10"></label><label class="graph-control" for="time-window">Time window <output id="time-window-value">8 s</output><input id="time-window" type="range" min="2" max="30" value="8" step="1"></label></div><canvas id="level-plot" role="img" aria-label="Scrolling microphone level in dBFS with signal threshold"></canvas><canvas id="plot" role="img" aria-label="Scrolling microphone pitch graph with chromatic note labels"></canvas></section>
</main><script src="pitch.js"></script><script src="app.js?v=graph-controls-1"></script></body></html>
